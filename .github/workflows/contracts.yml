name: Contract baseline
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15.2'
      - name: Install locked contract tooling
        run: python -m pip install -r requirements-contracts.lock
      - name: Check dependency consistency
        run: python -m pip check
      - name: Validate schemas and consumer fixtures
        run: python -m unittest discover -s tests/Contract -v
      - name: Check whitespace
        run: git diff --check
