    AutomationRule:
      title: P0 CRM Automation Rule
      type: object
      additionalProperties: false
      properties:
        ruleId:
          type: string
          minLength: 1
          maxLength: 128
        version:
          type: integer
          minimum: 1
        triggerEventType:
          type: string
          pattern: ^[a-z][a-zA-Z0-9.-]*\.v[1-9][0-9]*$
          maxLength: 128
        condition:
          $ref: '#/components/schemas/Rule_condition0'
        actions:
          type: array
          items:
            oneOf:
            - type: object
              additionalProperties: false
              required:
              - type
              - input
              properties:
                type:
                  const: crm.addTag.v1
                input:
                  type: object
                  additionalProperties: false
                  required:
                  - tag
                  properties:
                    tag:
                      type: string
                      minLength: 1
                      maxLength: 64
            - type: object
              additionalProperties: false
              required:
              - type
              - input
              properties:
                type:
                  const: crm.createNote.v1
                input:
                  type: object
                  additionalProperties: false
                  required:
                  - text
                  properties:
                    text:
                      type: string
                      minLength: 1
                      maxLength: 1000
            - type: object
              additionalProperties: false
              required:
              - type
              - installationId
              - input
              properties:
                type:
                  type: string
                  pattern: ^(?!crm\.)[a-z][a-zA-Z0-9.-]*\.v[1-9][0-9]*$
                  maxLength: 128
                installationId:
                  type: string
                  format: uuid
                input:
                  type: object
          minItems: 1
          maxItems: 10
        triggerInstallationId:
          type: string
          format: uuid
      required:
      - ruleId
      - version
      - triggerEventType
      - condition
      - actions
      allOf:
      - if:
          properties:
            triggerEventType:
              pattern: ^crm[.]
        then:
          not:
            required:
            - triggerInstallationId
        else:
          required:
          - triggerInstallationId
