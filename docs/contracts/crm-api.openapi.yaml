components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    webhookSignature:
      type: apiKey
      in: header
      name: X-Event-Signature
  parameters:
    TenantContext:
      name: X-Tenant-Id
      in: header
      required: true
      description: Selected tenant only; server verifies active membership or credential binding. Never an authorization
        assertion.
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 2048
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag from latest resource read; wildcard and weak tags rejected.
      schema:
        type: string
        pattern: ^"v[1-9][0-9]*"$
    InstallationId:
      name: X-Installation-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    WebhookKeyId:
      name: X-Webhook-Key-Id
      in: header
      required: true
      schema:
        type: string
        pattern: ^[a-zA-Z0-9_-]{1,64}$
    EventId:
      name: X-Event-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
    EventTimestamp:
      name: X-Event-Timestamp
      in: header
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]{9,11}$
  responses:
    Problem:
      description: Closed error; safe reasonToken and correlationId. No secrets or raw payload.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        reasonToken:
          type: string
          pattern: ^[A-Z][A-Z0-9_]+$
        correlationId:
          type: string
          minLength: 1
          maxLength: 128
        detail:
          type: string
          maxLength: 1000
      required:
      - type
      - title
      - status
      - reasonToken
      - correlationId
    Accepted:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - pending
          - accepted
          - duplicate
        correlationId:
          type: string
          minLength: 1
      required:
      - id
      - status
      - correlationId
    Tenant:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum:
          - active
          - suspended
      required:
      - id
      - name
      - status
    CreateTenant:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - name
    Membership:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        issuer:
          type: string
          format: uri
        subject:
          type: string
          minLength: 1
          maxLength: 256
        role:
          type: string
          enum:
          - owner
          - admin
          - agent
          - operator
        status:
          type: string
          enum:
          - active
          - revoked
        version:
          type: integer
          minimum: 1
      required:
      - id
      - issuer
      - subject
      - role
      - status
      - version
    UpdateMembership:
      type: object
      additionalProperties: false
      properties:
        role:
          enum:
          - admin
          - agent
          - operator
        status:
          type: string
          enum:
          - active
          - revoked
      required: []
      minProperties: 1
    CreateInvite:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        role:
          enum:
          - admin
          - agent
          - operator
      required:
      - email
      - role
    Invite:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          enum:
          - admin
          - agent
          - operator
        expiresAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - pending
          - accepted
          - revoked
          - expired
      required:
      - id
      - email
      - role
      - expiresAt
      - status
    AcceptInvite:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 512
      required:
      - token
    Contact:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type:
          - string
          - 'null'
          format: email
          maxLength: 320
        phone:
          type:
          - string
          - 'null'
          maxLength: 40
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - displayName
      - version
      - createdAt
      - updatedAt
    CreateContact:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type:
          - string
          - 'null'
          format: email
          maxLength: 320
        phone:
          type:
          - string
          - 'null'
          maxLength: 40
      required:
      - displayName
    UpdateContact:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type:
          - string
          - 'null'
          format: email
          maxLength: 320
        phone:
          type:
          - string
          - 'null'
          maxLength: 40
      required: []
      minProperties: 1
    CreateTag:
      type: object
      additionalProperties: false
      properties:
        name:
