openapi: 3.1.0
info:
  title: CRM Platform Operational API
  version: 1.0.0
  description: Anonymous operational surface. Readiness requires SELECT 1 and exact
    supported migration set within a three-second dependency budget.
security: []
paths:
  /health/live:
    get:
      operationId: getHealthLive
      responses:
        '200':
          description: Host is live; no database access.
          headers:
            Cache-Control:
              description: Operational responses must not be cached.
              schema:
                type: string
                enum:
                - no-store
            X-Correlation-Id:
              description: Correlation identifier generated by the server; caller
                values are not trusted.
              schema:
                type: string
                minLength: 1
                maxLength: 128
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - live
              examples:
                live:
                  value:
                    status: live
        '500':
          description: Safe operational failure. No dependency or exception details.
          headers:
            Cache-Control:
              description: Operational responses must not be cached.
              schema:
                type: string
                enum:
                - no-store
            X-Correlation-Id:
              description: Correlation identifier generated by the server; caller
                values are not trusted.
              schema:
                type: string
                minLength: 1
                maxLength: 128
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INTERNAL_ERROR:
                  value:
                    type: about:blank
                    title: Internal server error
                    status: 500
                    reasonToken: INTERNAL_ERROR
                    correlationId: 92d7a8d0e37340c69d66b31313cda39a
  /health/ready:
    get:
      operationId: getHealthReady
      responses:
        '200':
          description: Database and schema are ready.
          headers:
            Cache-Control:
              description: Operational responses must not be cached.
              schema:
                type: string
                enum:
                - no-store
            X-Correlation-Id:
              description: Correlation identifier generated by the server; caller
                values are not trusted.
              schema:
                type: string
                minLength: 1
                maxLength: 128
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - ready
              examples:
                ready:
                  value:
                    status: ready
        '500':
          description: Safe operational failure. No dependency or exception details.
          headers:
            Cache-Control:
              description: Operational responses must not be cached.
              schema:
                type: string
                enum:
                - no-store
            X-Correlation-Id:
              description: Correlation identifier generated by the server; caller
                values are not trusted.
              schema:
                type: string
                minLength: 1
                maxLength: 128
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INTERNAL_ERROR:
                  value:
                    type: about:blank
                    title: Internal server error
                    status: 500
                    reasonToken: INTERNAL_ERROR
                    correlationId: 92d7a8d0e37340c69d66b31313cda39a
        '503':
          description: Safe operational failure. No dependency or exception details.
          headers:
            Cache-Control:
              description: Operational responses must not be cached.
              schema:
                type: string
                enum:
                - no-store
            X-Correlation-Id:
              description: Correlation identifier generated by the server; caller
                values are not trusted.
              schema:
                type: string
                minLength: 1
                maxLength: 128
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                DATABASE_UNAVAILABLE:
                  value:
                    type: about:blank
                    title: Dependency unavailable
                    status: 503
                    reasonToken: DATABASE_UNAVAILABLE
                    correlationId: 92d7a8d0e37340c69d66b31313cda39a
                DATABASE_SCHEMA_NOT_READY:
                  value:
                    type: about:blank
                    title: Dependency unavailable
                    status: 503
                    reasonToken: DATABASE_SCHEMA_NOT_READY
                    correlationId: 92d7a8d0e37340c69d66b31313cda39a
components:
  schemas:
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        reasonToken:
          type: string
          pattern: ^[A-Z][A-Z0-9_]+$
        correlationId:
          type: string
          minLength: 1
          maxLength: 128
        detail:
          type: string
          maxLength: 1000
      required:
      - type
      - title
      - status
      - reasonToken
      - correlationId
